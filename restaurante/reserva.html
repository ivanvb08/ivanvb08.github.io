<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="author" content="Iván Vida Bravo">
  <meta name="description" content="Formulario para hacer una reserva en el restaurante">
  <meta name="keywords" content="reserva, formulario, restaurante, mesa">
  <link rel="icon" type="image/png" href="favicon.ico">
  <title>Reserva</title>
</head>
<body>
  <header>
    <h1>Haz una reserva</h1>
  </header>

  <nav>
    <ul>
      <li><a href="index.html">Volver a Formularios</a></li>
    </ul>
  </nav>

  <main>
    <form action="#" method="get"></form>
      <p>
        <label for="nombre">Su nombre:</label><br>
        <input type="text" id="nombre" name="nombre" required>
      </p>
      <p>
        <label for="clientes">Número de clientes:</label><br>
        <input type="number" id="clientes" name="clientes" min="1" required>
      </p>
      <p>
        <label for="correo">Su correo electrónico:</label><br>
        <input type="email" id="correo" name="correo" required>
      </p>
      <p>
        <label for="telefono">Su teléfono:</label><br>
        <input type="tel" id="telefono" name="telefono" required>
      </p>
      <p>
        <label for="fecha">Fecha de la reserva:</label><br>
        <input type="date" id="fecha" name="fecha" required>
      </p>
      <p>
        <label for="hora">Hora de la reserva:</label><br>
        <input type="time" id="hora" name="hora" required>
      </p>
      <p>
        <label for="mensaje">Su mensaje:</label><br>
        <textarea id="mensaje" name="mensaje" rows="4" cols="40"></textarea>
      </p>
      <p>
        <button type="submit">Solicitar reserva</button>
      </p>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 - Iván Vida Bravo</p>
  </footer>
</body>
</html>
