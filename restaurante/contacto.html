<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="author" content="Iván Vida Bravo">
  <meta name="description" content="Formulario de contacto con el restaurante">
  <meta name="keywords" content="contacto, formulario, mensaje, restaurante">
  <link rel="icon" type="image/png" href="favicon.ico">
  <title>Contacto</title>
</head>
<body>
  <header>
    <h1>Envíenos su mensaje</h1>
  </header>

  <nav>
    <ul>
      <li><a href="index.html">Volver a Formularios</a></li>
    </ul>
  </nav>

  <main>
    <form action="#" method="get"></form>
      <p>
        <label for="nombre">Su nombre:</label><br>
        <input type="text" id="nombre" name="nombre" required>
      </p>
      <p>
        <label for="correo">Su correo electrónico:</label><br>
        <input type="email" id="correo" name="correo" required>
      </p>
      <p>
        <label for="telefono">Su teléfono:</label><br>
        <input type="tel" id="telefono" name="telefono">
      </p>
      <p>
        <label for="asunto">Asunto:</label><br>
        <input type="text" id="asunto" name="asunto" required>
      </p>
      <p>
        <label for="mensaje">Su mensaje:</label><br>
        <textarea id="mensaje" name="mensaje" rows="8" cols="50" maxlength="500" required></textarea>
      </p>
      <p>
        <button type="submit">Enviar</button>
      </p>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 - Iván Vida Bravo</p>
  </footer>
</body>
</html>
