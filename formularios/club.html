<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="author" content="Iván Vida Bravo">
  <meta name="description" content="Cuestionario para formar parte del club Amigos de la informática">
  <meta name="keywords" content="club, informática, cuestionario, formulario">
  <title>Club Amigos de la informática</title>
</head>
<body>
  <header>
    <h1>Rellena el siguiente cuestionario para formar parte del club de "Amigos de la informática"</h1>
  </header>

  <nav>
    <ul>
      <li><a href="index.html">Volver a Formularios</a></li>
    </ul>
  </nav>

  <main>
    <form action="#" method="get">

      <fieldset>
        <legend>Datos personales</legend>
        <p>
          <label for="nombre">Nombre:</label>
          <input type="text" id="nombre" name="nombre" size="40" required>
        </p>
        <p>
          <label for="domicilio">Domicilio:</label>
          <input type="text" id="domicilio" name="domicilio" size="40" placeholder="<calle, número y localidad>">
        </p>
        <p>
          <label for="pais">País de origen:</label>
          <select id="pais" name="pais">
            <option value="espana" selected>España</option>
            <option value="portugal">Portugal</option>
            <option value="francia">Francia</option>
            <option value="italia">Italia</option>
            <option value="otro">Otro</option>
          </select>
        </p>
        <p>
          <label for="nacimiento">Fecha de nacimiento:</label>
          <input type="date" id="nacimiento" name="nacimiento">
        </p>
        <p>
          <label for="correo">Correo electrónico:</label>
          <input type="email" id="correo" name="correo">
        </p>
        <p>
          <label for="telefono">Teléfono:</label>
          <input type="tel" id="telefono" name="telefono">
        </p>
        <p>
          Estado civil:
          <input type="radio" id="soltero" name="estado" value="soltero">
          <label for="soltero">Soltero/a</label>
          <input type="radio" id="casado" name="estado" value="casado" checked>
          <label for="casado">Casado/a</label>
          <input type="radio" id="separado" name="estado" value="separado">
          <label for="separado">Separado/a</label>
          <input type="radio" id="viudo" name="estado" value="viudo">
          <label for="viudo">Viudo/a</label>
        </p>
        <p>
          Sexo:
          <input type="radio" id="hombre" name="sexo" value="hombre">
          <label for="hombre">Hombre</label>
          <input type="radio" id="mujer" name="sexo" value="mujer">
          <label for="mujer">Mujer</label>
        </p>
      </fieldset>

      <fieldset>
        <legend>Otra información de interés</legend>
        <p>
          <label for="componentes">Seleccione los componentes electrónicos con los que habitualmente trabajas:</label><br>
          <select id="componentes" name="componentes" multiple size="4">
            <option value="movil">Móvil</option>
            <option value="tablet">Tablet</option>
            <option value="ordenador">Ordenador</option>
            <option value="ebook">Ebook</option>
          </select>
        </p>
        <p>
          Seleccione tus actividades favoritas:<br>
          <input type="checkbox" id="deporte" name="actividades" value="deporte">
          <label for="deporte">Hacer deporte</label>
          <input type="checkbox" id="amigos" name="actividades" value="amigos">
          <label for="amigos">Salir con mis amigos</label>
          <input type="checkbox" id="series" name="actividades" value="series">
          <label for="series">Ver series, pelis...</label><br>
          <input type="checkbox" id="senderismo" name="actividades" value="senderismo">
          <label for="senderismo">Realizar rutas de senderismo</label>
          <input type="checkbox" id="cine" name="actividades" value="cine">
          <label for="cine">Ir al cine</label>
          <input type="checkbox" id="musica" name="actividades" value="musica">
          <label for="musica">Escuchar música</label>
        </p>
        <p>
          <label for="motivo">Explique brevemente el motivo por el que desea ingresar en nuestro club:</label><br>
          <textarea id="motivo" name="motivo" rows="5" cols="60"></textarea>
        </p>
        <p>
          <label for="peli">Elige o escribe tu peli favorita:</label>
          <input type="text" id="peli" name="peli" list="pelis">
          <datalist id="pelis">
            <option value="El Padrino">
            <option value="Matrix">
            <option value="Origen">
            <option value="Interestelar">
            <option value="El Señor de los Anillos">
          </datalist>
        </p>
      </fieldset>

      <p>
        <button type="submit">Enviar</button>
        <button type="reset">Cancelar</button>
      </p>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 - Iván Vida Bravo</p>
  </footer>
</body>
</html>
